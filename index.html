<style>
/* Layout: celular = coluna única (hero vertical 4:5, ticket VIP, vitrine, links). Desktop = hero horizontal 16:9 em largura total, ticket + links à esquerda e vitrine à direita. */
:root{
  --bg:#0E0E0E; --card:#1A1A1A; --line:rgba(255,255,255,.10);
  --fg:#F2F2F2; --muted:#A8A8A8; --dim:#6B6B6B;
  --yellow:#FEBD16; --yellow-soft:#FFDF75; --amber:#E89B00; --ink:#141414;
  --glass:rgba(255,255,255,.12);
  --display:"DM Sans",sans-serif;
  --body:"DM Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
a{color:inherit;text-decoration:none}
.bgblur{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat var(--h1);filter:blur(70px) brightness(.3) saturate(1.2);transform:scale(1.2)}
.wrap{max-width:440px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "cups" "trust" "seg" "shop" "links"}
.hero{grid-area:hero}.cups{grid-area:cups}.trust{grid-area:trust}.seg{grid-area:seg}.shop{grid-area:shop}.side{grid-area:links}
.shop,.side{display:flex;flex-direction:column;gap:12px;min-width:0}

/* HERO */
.hero{position:relative;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px 14px;max-width:100%;background:var(--ink);isolation:isolate;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.hv-wrap{position:relative;z-index:2;margin:44px -14px 0;aspect-ratio:4/3;max-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 7%,#000 16%,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 7%,#000 16%,#000 78%,transparent 100%)}
.hv-wrap::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(14,14,14,.25) 0%,rgba(14,14,14,0) 22%,rgba(14,14,14,0) 62%,rgba(14,14,14,.4) 100%)}
.hv-wrap video,.hv-wrap .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.bgv{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.62) saturate(1.2);transform:scale(1.35);opacity:.9}
.slide{background:center/cover no-repeat;opacity:0;transform:scale(1.08);transition:opacity 1.1s ease}
.slide.on{opacity:1;animation:kb 6.5s linear forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1.18) translateX(-2%)}}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(14,14,14,0) 0%,rgba(14,14,14,.15) 35%,rgba(14,14,14,.45) 60%,rgba(14,14,14,.65) 100%)}
.topbar{position:absolute;z-index:3;top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 28px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.2)}
.wm{display:block;width:120px;height:12px;background:#fff;-webkit-mask:var(--wm) left center/contain no-repeat;mask:var(--wm) left center/contain no-repeat}
.pill{display:inline-flex;align-items:center;gap:9px;padding:11px 18px 11px 15px;border-radius:999px;background:radial-gradient(120% 160% at 0% 0%,#FFE48A 0%,rgba(255,228,138,0) 50%),linear-gradient(135deg,#FFD24D 0%,var(--yellow) 50%,var(--amber) 100%);color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 6px 18px rgba(254,189,22,.3)}
.dot{position:relative;flex:none;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.dot::before,.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ink);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.dot::after{animation-delay:.9s}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.hcopy{position:relative;z-index:3;display:flex;flex-direction:column;gap:18px;margin-top:-34px}
.hcopy .ng,.hcopy .rastro{margin-left:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.ng{display:block;width:min(100%,330px);height:auto;color:#fff}
.ontela{display:flex;align-items:center;gap:10px;align-self:flex-start;max-width:100%;padding:7px 7px 7px 12px;border-radius:999px;background:rgba(20,20,20,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);font-size:14px}
.ontela .wa{flex:none;width:20px;height:20px;color:#25D366}
.ontela b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ontela i{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-style:normal}
.ontela i svg,.arrow svg{width:16px;height:16px}
.bars{display:none}
.bars span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:#fff}
.bars span.done i{width:100%}
.bars span.run i{animation:fill var(--dur,5.5s) linear forwards}
@keyframes fill{to{width:100%}}
.tap{display:none}
.tap.l{left:0}.tap.r{right:0}
.mute{position:absolute;z-index:3;right:20px;bottom:44px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;cursor:pointer}
.mute svg{width:18px;height:18px}

/* TICKET VIP (mesma estrutura do cupom da referência) */
.ticket{position:relative;border-radius:22px;color:var(--ink);filter:drop-shadow(0 24px 40px rgba(254,189,22,.16))}
.tk-top{position:relative;padding:16px 18px 16px;border-radius:22px 22px 0 0;background:radial-gradient(120% 140% at 0% 0%,#FFE48A 0%,rgba(255,228,138,0) 45%),linear-gradient(135deg,#FFD24D 0%,var(--yellow) 45%,var(--amber) 100%);overflow:hidden;isolation:isolate}
.deco{position:absolute;z-index:-1;pointer-events:none}
.gbox{width:30px;height:26px;background:var(--ink);-webkit-mask:var(--gb) center/contain no-repeat;mask:var(--gb) center/contain no-repeat}
.rastro{display:block;height:5px;border-radius:999px;background:linear-gradient(90deg,var(--yellow) 0%,rgba(254,189,22,0) 100%)}
.hero .rastro{width:260px;max-width:100%;height:3px;margin-top:-4px}
.sec-h .rastro{width:72px;margin-top:8px}
footer .sep{display:block;width:200px;height:1px;margin:16px 0;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 100%)}
.deco.pill-d{right:-36px;top:28px;width:64px;height:230px}
.deco.circ-d{left:-74px;top:58px;width:130px;height:130px}
.tk-top::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);transform:translateX(-110%);animation:sheen 5s ease-in-out 1.5s infinite;pointer-events:none}
@keyframes sheen{40%,100%{transform:translateX(110%)}}
.tk-g{position:absolute;top:18px;right:18px}
.label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.gmark{width:94px;height:10px;background:var(--ink);-webkit-mask:var(--wm) right center/contain no-repeat;mask:var(--wm) right center/contain no-repeat}
.tk-main{margin-top:0}
.tk-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px}
.big{margin:0;padding-right:44px;font-family:var(--display);font-weight:700;font-size:clamp(19px,5.4vw,25px);line-height:1.05;letter-spacing:-.03em}
.big span{display:block;white-space:nowrap}
.nw{white-space:nowrap}
.sub{margin:6px 0 0;font-size:12.5px;color:rgba(20,20,20,.72);line-height:1.4}
.btn{flex:none;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 20px rgba(20,20,20,.22);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.cd{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:9px 12px;border-radius:16px;border:1.5px solid rgba(20,20,20,.18);background:rgba(255,255,255,.5)}
.cd-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(20,20,20,.6)}
.cd-pct{font-variant-numeric:tabular-nums;color:var(--ink)}
.cd-nums{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd-u{display:flex;align-items:baseline;gap:2px}
.cd-u b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1}
.cd-u i{font-style:normal;font-size:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(20,20,20,.55)}
.cd-sep{font-size:11px;font-weight:700;color:rgba(20,20,20,.35);line-height:1}
.cd-bar{position:relative;height:5px;border-radius:999px;background:rgba(20,20,20,.12);overflow:hidden}
.cd-bar span{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--amber));transition:width 1s linear}
.cd-bar span::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);animation:cd-shine 2.4s linear infinite}
@keyframes cd-shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.perf{position:relative;height:0}
.perf hr{position:absolute;left:20px;right:20px;top:-1px;margin:0;border:0;border-top:2px dashed rgba(20,20,20,.3);z-index:2}
.tk-top{-webkit-mask:radial-gradient(circle 12px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 12px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
.tk-bot{-webkit-mask:radial-gradient(circle 12px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 12px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
.tk-bot{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 8px 14px;border-radius:0 0 22px 22px;background:linear-gradient(160deg,#FFFFFF 0%,#EDEDED 100%);color:var(--ink)}
.ben{display:flex;flex-direction:column;gap:7px;padding:0 12px;min-width:0}
.ben+.ben{border-left:1px solid rgba(20,20,20,.12)}
.ben svg{width:17px;height:17px;color:#F5A800}
.ben b{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}

/* CUPONS */
.cups{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.cups-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;grid-column:1 / -1;padding:6px 4px 0}
.cups-h h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.cups-h span{font-size:11.5px;color:var(--dim)}
.cup{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;border-radius:16px;border:0;background:radial-gradient(120% 140% at 0% 0%,#FFE48A 0%,rgba(255,228,138,0) 45%),linear-gradient(135deg,#FFD24D 0%,var(--yellow) 45%,var(--amber) 100%);color:var(--ink);box-shadow:0 10px 24px rgba(254,189,22,.18);transition:transform .2s,filter .2s;cursor:pointer;text-align:left;font-family:var(--body);appearance:none;min-width:0;-webkit-mask:radial-gradient(circle 9px at 0 calc(100% - 38px),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% calc(100% - 38px),#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 9px at 0 calc(100% - 38px),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% calc(100% - 38px),#0000 97%,#000) right/51% 100% no-repeat}
.cup:hover{transform:translateY(-2px);filter:brightness(1.04)}
.cup:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
.cup .ctx{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px}
.cup .ey{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(20,20,20,.7)}
.cup b{grid-row:1 / span 2;grid-column:2;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap;text-align:right}
.cup small{grid-column:1;font-size:12px;color:rgba(20,20,20,.72);line-height:1.35}
.cup .ship{grid-column:1;justify-self:start;display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:var(--ink);color:var(--yellow);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cup .code{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 0 0;border-top:1.5px dashed rgba(20,20,20,.35);color:var(--ink);font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.06em}
.cup .code svg{width:16px;height:16px;flex:none;color:var(--ink)}
.cup.copied .code{color:var(--ink)}

/* VITRINE */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:10px 4px 0}
.sec-h h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.sec-h span{font-size:12px;color:var(--dim)}
.feat{position:relative;display:block;border-radius:24px;overflow:hidden;aspect-ratio:16/11;max-width:100%;background:var(--card)}
.feat img,.pcard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.feat:hover img,.pcard:hover img{transform:scale(1.04)}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.75) 100%)}
.feat .cap{position:absolute;z-index:2;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2)}
.feat strong{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.arrow{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.pcard .ph{aspect-ratio:1/1;overflow:hidden;max-width:100%}
.pcard .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard b{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.pcard small{font-size:12px;color:var(--muted);line-height:1.35}
.mslogo{display:block;height:15px;width:118px;max-width:100%;margin:2px 0 3px;background:var(--fg);-webkit-mask:var(--ms) left center/contain no-repeat;mask:var(--ms) left center/contain no-repeat}

/* LINKS */
.links{display:flex;flex-direction:column;gap:8px}
.trust{display:flex;align-items:center;gap:16px;padding:16px 18px 16px 14px;border-radius:22px;background:linear-gradient(135deg,#FFFAE8 0%,#FFF0C2 100%);color:var(--ink);border:1px solid rgba(254,189,22,.6);box-shadow:0 18px 40px -24px rgba(254,189,22,.55)}
.trust img{flex:none;width:92px;height:auto}
.trust .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.trust .ey{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(20,20,20,.55)}
.trust b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.trust small{font-size:13px;color:rgba(20,20,20,.7);line-height:1.4}
.trust .go2{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.trust .go2 svg{width:14px;height:14px}
.seg{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px 14px;padding:18px 16px;border-radius:22px;background:linear-gradient(150deg,#262626 0%,#1A1A1A 100%);border:1.5px dashed rgba(254,189,22,.6)}
.seg .si{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(254,189,22,.14);color:var(--yellow)}
.seg .si svg{width:24px;height:24px}
.seg .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.seg .ey{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.seg small{font-size:12.5px;color:var(--muted);line-height:1.4}
.seg .cta2{grid-column:1 / -1;display:flex;justify-content:center;align-items:center;gap:6px;padding:12px 14px;border-radius:999px;background:radial-gradient(120% 160% at 0% 0%,#FFE48A 0%,rgba(255,228,138,0) 50%),linear-gradient(135deg,#FFD24D 0%,var(--yellow) 50%,var(--amber) 100%);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lk{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:background .2s,border-color .2s}
.lk:hover{background:#232323;border-color:rgba(255,255,255,.18)}
.lk .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--yellow)}
.lk .ic svg{width:19px;height:19px}
.lk .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lk b{font-weight:600;font-size:15px}
.lk small{color:var(--muted);font-size:12.5px}
.lk .go{color:var(--dim)}
.lk .go svg{width:16px;height:16px;display:block}
.social{display:flex;justify-content:center;gap:10px;padding-top:6px}
.social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}
.social svg{width:19px;height:19px}
footer{display:flex;flex-direction:column;align-items:center;gap:0;padding:18px 0 4px;text-align:center}
footer .wm{width:150px;height:15px;background:var(--fg);-webkit-mask-position:center;mask-position:center}
footer p{margin:0;color:var(--dim);font-size:13px;line-height:1}

a:focus-visible,button:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}

.toast.show{opacity:1;transform:translate(-50%,0)}

.card-pending{opacity:0;translate:0 48px;scale:.96}
.card-enter{animation:card-arrive 1100ms cubic-bezier(.25,.8,.25,1) both;animation-delay:var(--card-delay,0ms)}
.card-pending:focus-within{opacity:1;translate:none;scale:1}
